[package]
name = "nexus-ai"
version = "0.1.0"
description = "NEXUS AI - Autonomous multi-agent desktop AI application"
authors = ["lil-smoker2"]
edition = "2021"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
lto = true
