# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = backend/app/database/migrations

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "version" file name
# version_len_constraint = 48

# license code to use when versioning
# license_code =

# the template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location
version_location = backend/app/database/migrations/versions

# the version table name
version_table = alembic_version

# naming convention for constraints
# naming_convention =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# format: "hooks = <comma separated list of hook IDs>"

# hooks = my_hook

# type of the hook to run
# my_hook.type = console_scripts

# entry point of the hook
# my_hook.entrypoint = mypackage.submodule:function

# variables to be passed to the hook
# my_hook.some_option = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
