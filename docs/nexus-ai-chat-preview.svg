  <circle cx="1551" cy="136" r="2" fill="#7E8592"/>
  <circle cx="1558" cy="136" r="2" fill="#7E8592"/>

  <rect x="1280" y="159" width="286" height="55" rx="9" fill="#202631" stroke="#353D49"/>
  <circle cx="1298" cy="178" r="3" fill="#A994EA"/>
  <text x="1310" y="181" fill="#E4E4EB" font-size="9.5" font-weight="560">Picking up on your idea</text>
  <text x="1295" y="199" fill="#969DAA" font-size="8.5">A gentle place to sort thoughts and notice wins.</text>

  <text x="1281" y="246" fill="#D8DAE1" font-size="10" font-weight="620">What I'm hearing</text>
  <path d="M1281 258h282" stroke="#313945"/>
  <text x="1281" y="280" fill="#A7ADBA" font-size="9">You're drawn to making something</text>
  <text x="1281" y="295" fill="#A7ADBA" font-size="9">small, calming, and genuinely useful.</text>
  <text x="1281" y="317" fill="#A7ADBA" font-size="9">It could help people put their thoughts</text>
  <text x="1281" y="332" fill="#A7ADBA" font-size="9">somewhere safe and hold onto little wins.</text>

  <rect x="1281" y="353" width="4" height="55" rx="2" fill="#A994EA"/>
  <text x="1298" y="368" fill="#8F96A4" font-size="8.5">POSSIBLE NEXT STEP</text>
  <text x="1298" y="387" fill="#D5D4DE" font-size="9">Explore the feeling you want someone</text>
  <text x="1298" y="402" fill="#D5D4DE" font-size="9">to leave with after using it.</text>

  <text x="1281" y="448" fill="#D8DAE1" font-size="10" font-weight="620">Conversation themes</text>
  <path d="M1281 460h282" stroke="#313945"/>
  <rect x="1281" y="474" width="115" height="24" rx="12" fill="#2B293A" stroke="#47415E"/>
  <circle cx="1295" cy="486" r="3" fill="#B49FEF"/>
  <text x="1304" y="490" fill="#C7BEDF" font-size="8">Meaningful projects</text>
  <rect x="1403" y="474" width="144" height="24" rx="12" fill="#282D35" stroke="#414752"/>
  <text x="1416" y="490" fill="#BEC2CC" font-size="8">Gentle productivity</text>

  <rect x="1280" y="532" width="286" height="1" fill="#313945"/>
  <text x="1281" y="559" fill="#D8DAE1" font-size="10" font-weight="620">A note for later</text>
  <text x="1281" y="582" fill="#9DA4B1" font-size="9">You mentioned wanting to make a</text>
  <text x="1281" y="598" fill="#9DA4B1" font-size="9">small, cozy space for daily reflection.</text>
  <rect x="1281" y="614" width="105" height="24" rx="7" fill="#242A35" stroke="#3B4350"/>
  <path d="M1295 621h9v9h-9zM1297 619v4m5-4v4" stroke="#A6AAB5" stroke-width="1"/>
  <text x="1311" y="630" fill="#BCC0CA" font-size="8">Save as memory</text>

  <path d="M1280 671h286" stroke="#313945"/>
  <text x="1281" y="698" fill="#D8DAE1" font-size="10" font-weight="620">Your controls</text>
  <text x="1281" y="721" fill="#999FAC" font-size="8.5">Your private thoughts stay in your workspace.</text>
  <rect x="1281" y="740" width="133" height="31" rx="8" fill="#242A35" stroke="#3B4350"/>
  <path d="M1297 750v10m-3-7 3-3 3 3" stroke="#A7AAB6" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1309" y="759" fill="#C4C6CF" font-size="8.5">Manage memory</text>
  <text x="1281" y="812" fill="#79818F" font-size="8.5">Thinking panel is private to you.</text>
  <circle cx="1285" cy="836" r="2.5" fill="#67D6A4"/>
  <text x="1294" y="839" fill="#9299A6" font-size="8.5">Your companion is ready</text>
