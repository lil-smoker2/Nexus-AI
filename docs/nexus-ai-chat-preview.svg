  <rect x="567" y="55" width="694" height="918" fill="#202733" fill-opacity=".72"/>
  <text x="594" y="91" fill="#E8E9EF" font-size="13" font-weight="620">A little catch-up</text>
  <text x="594" y="111" fill="#858D9C" font-size="9">Companion  ·  Private conversation</text>
  <circle cx="1195" cy="88" r="3" fill="#69D5A5"/>
  <text x="1208" y="92" text-anchor="end" fill="#AEB3BF" font-size="9">Online</text>
  <path d="M567 139h694" stroke="#3A414E"/>

  <text x="594" y="166" fill="#717987" font-size="8.5">TODAY  ·  9:41 PM</text>

  <rect x="647" y="181" width="528" height="130" rx="15" fill="url(#userBubble)" stroke="#6E6682" stroke-opacity=".65"/>
  <text x="665" y="205" fill="#E7E4EF" font-size="10.5" font-weight="580">Hi! I feel like I've got a lot on my mind today.</text>
  <text x="665" y="225" fill="#D6D3E1" font-size="10">Could you help me sort through some ideas for a personal</text>
  <text x="665" y="241" fill="#D6D3E1" font-size="10">project? I want it to feel meaningful, but I'm not sure</text>
  <text x="665" y="257" fill="#D6D3E1" font-size="10">where to start. ✨</text>
  <text x="665" y="290" fill="#AFA9C0" font-size="8">You  ·  9:41 PM</text>

  <rect x="595" y="326" width="535" height="112" rx="15" fill="url(#surface)" stroke="#414856"/>
  <circle cx="614" cy="347" r="8" fill="#7F70AE" fill-opacity=".34"/>
  <circle cx="614" cy="347" r="3.2" fill="#C1ADFF"/>
  <text x="631" y="350" fill="#ADB2BF" font-size="8.5" font-weight="610">NEXUS COMPANION</text>
  <text x="613" y="374" fill="#E3E5EB" font-size="10">Absolutely. We can take it one step at a time—no need to</text>
  <text x="613" y="391" fill="#E3E5EB" font-size="10">have everything figured out yet. What kinds of things have</text>
  <text x="613" y="408" fill="#E3E5EB" font-size="10">been making you curious lately? 🌱</text>
  <text x="613" y="426" fill="#89909E" font-size="8">Just now</text>

  <rect x="664" y="455" width="511" height="105" rx="15" fill="url(#userBubble)" stroke="#6E6682" stroke-opacity=".65"/>
  <text x="683" y="480" fill="#D6D3E1" font-size="10">I've been thinking about making something small that helps</text>
  <text x="683" y="497" fill="#D6D3E1" font-size="10">people feel a little less overwhelmed. Maybe a cozy space</text>
  <text x="683" y="514" fill="#D6D3E1" font-size="10">to organize thoughts and little daily wins.</text>
  <text x="683" y="541" fill="#AFA9C0" font-size="8">You  ·  9:44 PM</text>

  <rect x="595" y="577" width="535" height="205" rx="15" fill="url(#surface)" stroke="#414856"/>
  <circle cx="614" cy="598" r="8" fill="#7F70AE" fill-opacity=".34"/>
  <circle cx="614" cy="598" r="3.2" fill="#C1ADFF"/>
  <text x="631" y="601" fill="#ADB2BF" font-size="8.5" font-weight="610">NEXUS COMPANION</text>
  <text x="613" y="625" fill="#E3E5EB" font-size="10">That's a lovely starting point. I hear two things in it:</text>
  <text x="613" y="648" fill="#D6D0EC" font-size="10" font-weight="580">making space to reflect, and noticing what's going right.</text>
  <text x="613" y="672" fill="#E3E5EB" font-size="10">Maybe it begins as a simple daily check-in: one place to</text>
  <text x="613" y="689" fill="#E3E5EB" font-size="10">set something down, and one small thing worth remembering.</text>
  <text x="613" y="718" fill="#E3E5EB" font-size="10">Would you rather sketch what the experience could feel</text>
  <text x="613" y="735" fill="#E3E5EB" font-size="10">like, or explore a few ideas together first? 💜</text>
  <text x="613" y="765" fill="#89909E" font-size="8">Just now</text>

  <rect x="1182" y="189" width="4" height="560" rx="2" fill="#39404C"/>
  <rect x="1182" y="584" width="4" height="127" rx="2" fill="#85828F"/>

