  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2430"/>
      <stop offset=".55" stop-color="#171D28"/>
      <stop offset="1" stop-color="#131922"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#303747"/>
      <stop offset="1" stop-color="#272D3A"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#554D70"/>
      <stop offset="1" stop-color="#48425D"/>
    </linearGradient>
    <linearGradient id="avatarTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CEC6E5"/>
      <stop offset=".5" stop-color="#AAA3C0"/>
      <stop offset="1" stop-color="#797991"/>
    </linearGradient>
    <linearGradient id="avatarPants" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#252833"/>
      <stop offset="1" stop-color="#11151D"/>
    </linearGradient>
    <radialGradient id="avatarLight" cx="0" cy="0" r="1" gradientTransform="matrix(1 0 0 .99 0 0)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A894E8" stop-opacity=".19"/>
      <stop offset="1" stop-color="#A894E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#080A10" flood-opacity=".28"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .white { fill: #F1F1F6; }
      .muted { fill: #9BA1AF; }
      .quiet { fill: #747B8A; }
      .panel { fill: #191F29; }
      .stroke { stroke: #353C49; }
    </style>
  </defs>

